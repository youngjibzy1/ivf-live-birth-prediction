[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivf-live-birth-prediction"
version = "0.1.0"
description = "ML live-birth prediction before IVF treatment - gradient boosting + logistic baseline with full evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ajibola Feyishola" }]
keywords = ["ivf", "clinical-ml", "scikit-learn", "live-birth", "reproduction"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]